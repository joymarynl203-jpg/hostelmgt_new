# Render Blueprint — Web Service + PostgreSQL
# https://render.com/docs/blueprint-spec
databases:
  - name: hostelmgt-db
    databaseName: hostelmgt
    user: hostelmgt
    plan: free

services:
  - type: web
    name: hostelmgt
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: HMS_DB_DRIVER
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: hostelmgt-db
          property: connectionString
      - key: HMS_BASE_URL
        value: /
      - key: SA_BASE_URL
        value: /superadmin/
      - key: HMS_DEMO_SETUP_KEY
        value: ""
      - key: HMS_PESAPAL_ENV
        value: sandbox
      - key: HMS_PESAPAL_CONSUMER_KEY
        sync: false
      - key: HMS_PESAPAL_CONSUMER_SECRET
        sync: false
