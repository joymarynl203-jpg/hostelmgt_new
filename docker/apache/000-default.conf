<VirtualHost *:8080>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/HMS/public

    # Super Admin portal: https://YOUR_APP.onrender.com/superadmin/
    Alias /superadmin /var/www/html/hms_superadmin/public

    <Directory /var/www/html/HMS/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html/hms_superadmin/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
